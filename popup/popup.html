<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>3D 模型收藏助手</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <div class="logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#00ae42">
        <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
      </svg>
      <h1>3D 模型收藏夹</h1>
    </div>
    <div class="header-right">
      <button id="manageCategoryBtn" class="header-link-btn">管理分组</button>
      <span id="totalBadge" class="badge">共 0 个</span>
    </div>
  </header>

  <div class="action-card">
    <div class="collect-row">
      <button id="collectCurrentBtn" class="primary-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
        </svg>
        收藏当前打开的模型
      </button>
      <select id="targetCategorySelect" class="target-category-select" title="存入指定分组">
      </select>
    </div>
    <div id="pageTip" class="page-tip"></div>
  </div>

  <div class="toolbar">
    <div class="toolbar-top">
      <input id="searchInput" type="text" placeholder="搜索模型标题或作者..." />
      <button id="exportBtn" class="icon-btn" title="导出备份">导出</button>
    </div>
    <div class="toolbar-bottom">
      <select id="categoryFilter">
        <option value="all">全部分组</option>
      </select>
      <select id="platformFilter">
        <option value="all">全部站点</option>
        <option value="intl">MakerWorld 国际站</option>
        <option value="cn">MakerWorld 国内站</option>
        <option value="printables">Printables</option>
        <option value="thingiverse">Thingiverse</option>
        <option value="thangs">Thangs</option>
        <option value="cults3d">Cults3D</option>
      </select>
    </div>
  </div>

  <div id="list" class="list"></div>

  <div id="empty" class="empty" style="display: none;">
    <div class="empty-icon">📂</div>
    <div class="empty-title">收藏夹还是空的</div>
    <div class="empty-desc">打开任意支持的模型页面，点击右上角的「收藏当前打开的模型」或页面右下角的「收藏模型」悬浮按钮即可。</div>
  </div>

  <div id="categoryModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2>分组管理</h2>
        <button id="closeModalBtn" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="add-cat-row">
          <input id="newCatInput" type="text" placeholder="新建分组名称..." />
          <button id="addCatBtn" class="add-btn">添加</button>
        </div>
        <div id="catList" class="cat-list"></div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
